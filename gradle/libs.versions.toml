# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format

[versions]
junit-jupiter = "6.0.1"
azure-resourcemanager = "2.47.0"
azure-identity = "1.14.2"
azure-subscription = "1.0.0"
testcontainers = "1.20.4"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
springdoc-openapi-starter-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version = "3.0.2" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version = "3.0.2" }
azure-resourcemanager = { module = "com.azure.resourcemanager:azure-resourcemanager", version.ref = "azure-resourcemanager" }
azure-identity = { module = "com.azure:azure-identity", version.ref = "azure-identity" }
azure-subscription = { module = "com.azure.resourcemanager:azure-resourcemanager-subscription", version.ref = "azure-subscription" }
testcontainers-mongodb = { module = "org.testcontainers:mongodb", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

[bundles]
springdoc-webmvc = ["springdoc-openapi-starter-webmvc-api", "springdoc-openapi-starter-webmvc-ui"]
