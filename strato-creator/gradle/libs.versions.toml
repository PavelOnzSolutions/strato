[versions]


[libraries]
springdoc-openapi-starter-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version = "2.8.14" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version = "2.8.14" }
jackson-databind-nullable = { module = "org.openapitools:jackson-databind-nullable", version = "0.2.6" }
openapi-generator = { module = "org.openapitools:openapi-generator-gradle-plugin", version = "7.17.0" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version = "8.0.0" }
bom-azure-sdk = { module = "com.azure:azure-sdk-bom", version = "1.3.2" }
bom-azure-spring-cloud = { module = "com.azure.spring:spring-cloud-azure-dependencies", version = "6.0.0" }
bom-spring-ai = { module = "org.springframework.ai:spring-ai-bom", version = "1.1.0" }
bom-semantickernel = { module = "com.microsoft.semantic-kernel:semantickernel-bom", version = "1.4.3" }
ehcache = { module = "org.ehcache:ehcache", version = "3.10.8" }
cache-api = { module = "jakarta.cache:jakarta.cache-api", version = "2.1.1" }

[plugins]
spring-boot = { id = "org.springframework.boot", version = "3.5.7" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }

[bundles]
springdoc-webmvc = ["springdoc-openapi-starter-webmvc-api", "springdoc-openapi-starter-webmvc-ui"]